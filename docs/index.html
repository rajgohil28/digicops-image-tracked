    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script>
      // Custom A-Frame component to force all materials to be opaque and double-sided
      AFRAME.registerComponent('force-opaque', {
        init: function () {
          this.el.addEventListener('model-loaded', (e) => {
            const model = e.detail.model;
            if (!model) return;
            model.traverse((node) => {
              if (node.isMesh && node.material) {
                const materials = Array.isArray(node.material) ? node.material : [node.material];
                materials.forEach((mat) => {
                  mat.transparent = true;       // Transparency mode: enabled
                  mat.alphaTest = 0.5;          // Helps with depth testing
                  mat.depthWrite = true;
                  mat.opacity = 1.0;            // Mode: Opaque appearance
                  mat.side = THREE.DoubleSide;  // Fixes one-sided issues
                  mat.needsUpdate = true;
                });
              }
            });
            console.log('[force-opaque] Applied opaque + double-sided to:', this.el.id);
          });
        }
      });

      // Custom A-Frame component to listen for animation finished events
      AFRAME.registerComponent('animation-finished-listener', {
        init: function () {
          const el = this.el;
          
          const handleFinished = (e) => {
            // Only trigger if the element is visible
            const isVisible = el.getAttribute('visible');
            if (isVisible === false || isVisible === 'false') return;

            const mixer = el.components && el.components['animation-mixer'];
            // Check if we are in 'once' loop mode
            if (mixer && mixer.data && mixer.data.loop === 'once') {
              console.log('[animation-finished-listener] Animation finished for:', el.id);
              // Send the element ID so the component knows which model finished
              window.dispatchEvent(new CustomEvent('animation-finished-event', { 
                detail: { id: el.id } 
              }));
            }
          };

          el.addEventListener('animation-finished', handleFinished);
          el.addEventListener('finished', handleFinished);
        }
      });
    </script>
